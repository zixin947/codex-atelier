[package]
name = "cockpit-session-compat"
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = "0.4"
toml_edit = "0.20"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
tempfile = "3"
[dev-dependencies]
libc = "0.2"
