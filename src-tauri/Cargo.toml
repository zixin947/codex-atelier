[package]
name = "codex-atelier"
version = "0.1.0"
description = "A personal Codex companion workstation"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
semver = "1"
atelier-maintenance-core = { path = "crates/maintenance-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.4"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
fs2 = "0.4"
url = "2"
toml = "0.9"
toml_edit = "0.25.17"
time = { version = "0.3", features = ["parsing"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
zstd = "0.14.3"
cockpit-session-compat = { path = "crates/cockpit-session-compat" }
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
