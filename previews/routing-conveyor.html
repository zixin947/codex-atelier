const ns='http://www.w3.org/2000/svg', belts=document.getElementById('belts'), cargo=document.getElementById('cargo');
const routes=['M250 314 L326 314 Q350 314 350 290 L350 214 Q350 190 374 190 L450 190','M640 190 L721 190 Q745 190 745 214 L745 350 Q745 374 769 374 L850 374','M1010 374 L1036 374 Q1060 374 1060 398 L1060 631 Q1060 655 1036 655 L640 655','M450 655 L64 655 Q40 655 40 631 L40 338 Q40 314 64 314 L90 314'];
const paths=routes.map(d=>{let p;for(const cls of ['rail','lip','belt']){p=document.createElementNS(ns,'path');p.setAttribute('class',cls);p.setAttribute('d',d);belts.append(p)}return p});
for(const p of paths){for(let d=24;d<p.getTotalLength()-8;d+=42){const a=p.getPointAtLength(d),b=p.getPointAtLength(d+1),arrow=document.createElementNS(ns,'path');arrow.setAttribute('class','arrow');arrow.setAttribute('d','M-3.5 -3.5L4 0L-3.5 3.5Z');arrow.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI})`);belts.append(arrow)}}
// Closed visual loop; device-interior segments are hidden from the canvas.
const hiddenRoutes=['M450 190 L640 190','M850 374 L1010 374','M640 655 L450 655','M90 314 L250 314'];
const journey=[];
paths.forEach((path,i)=>{journey.push({path,hidden:false,back:i>=2});const inside=document.createElementNS(ns,'path');inside.setAttribute('d',hiddenRoutes[i]);inside.setAttribute('fill','none');inside.setAttribute('stroke','none');belts.append(inside);journey.push({path:inside,hidden:true,back:i>=2})});
const lengths=journey.map(s=>s.path.getTotalLength()),total=lengths.reduce((a,b)=>a+b,0);
const count=Math.floor(total/40),spacing=total/count;
const boxes=Array.from({length:count},()=>{const box=document.createElementNS(ns,'g');box.setAttribute('class','cargo');const use=document.createElementNS(ns,'use');use.setAttribute('href','#crate');box.append(use);cargo.append(box);return box});
let elapsed=0,last=0,playing=!window.ATELIER_LIVE&&!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,frame=0;
const pause=document.getElementById('pause'),state=document.getElementById('state');
function position(distance){distance=((distance%total)+total)%total;let index=0;while(index<journey.length-1&&distance>lengths[index])distance-=lengths[index++];const segment=journey[index];return {point:segment.path.getPointAtLength(distance),hidden:segment.hidden,back:segment.back}}
function draw(){let visible=0;boxes.forEach((box,i)=>{const {point,hidden,back}=position(elapsed/1000*18+i*spacing);box.setAttribute('transform',`translate(${point.x} ${point.y}) scale(1.2)`);box.classList.toggle('back',back);box.setAttribute('visibility',hidden?'hidden':'visible');if(!hidden)visible++});document.getElementById('visibleCount').textContent=visible;document.getElementById('velocity').textContent=`${playing?18*speed:0} px/s`;state.textContent=`${playing?'闭环缓慢输送中':'已暂停'} · 带面可见 ${visible} 箱 · 约 50% 占用`;pause.textContent=playing?'暂停':'播放'}
function tick(now){if(last)elapsed+=Math.min(now-last,100)*speed;last=now;draw();if(playing)frame=requestAnimationFrame(tick)}
function sync(){last=0;cancelAnimationFrame(frame);draw();if(playing)frame=requestAnimationFrame(tick)}
pause.onclick=()=>{playing=!playing;sync()};
document.getElementById('restart').onclick=()=>{elapsed=0;playing=true;sync()};
document.getElementById('speed').onchange=e=>speed=Number(e.target.value);
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)cancelAnimationFrame(frame);else if(playing)frame=requestAnimationFrame(tick)});sync();
</script></html>
